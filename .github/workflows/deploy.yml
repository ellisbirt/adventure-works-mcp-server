name: Deploy gateway

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable GHCR tag produced by Gateway CI (for example sha-<commit-sha>). Leave blank to deploy the latest successful main build.
        required: false
        type: string
      image_digest:
        description: Content digest of the image (for example sha256:abc123...). Strongly recommended to prevent tag replacement attacks. Leave blank to query the registry (less secure).
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: gateway-production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Deploy selected gateway image and frontend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve image tag and digest
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          IMAGE_DIGEST_INPUT: ${{ inputs.image_digest }}
        run: |
          image_tag="$IMAGE_TAG_INPUT"
          image_digest="$IMAGE_DIGEST_INPUT"
          
          if [[ -z "$image_tag" ]]; then
            # Retrieve the latest successful Gateway CI run on main
            head_sha=$(gh api "repos/${{ github.repository }}/actions/workflows/gateway-image.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
            if [[ -z "$head_sha" ]]; then
              echo "::error::No successful Gateway CI run found on main; pass image_tag and image_digest explicitly."
              exit 1
            fi
            
            image_tag="sha-$head_sha"
            echo "No image_tag supplied; resolved latest successful main build: $image_tag"
          fi
          
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]

      - name: Validate image digest format
        if: inputs.image_digest != ''
        env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Verify image provenance
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          PROVIDED_DIGEST: ${{ steps.resolve.outputs.image_digest }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          commit_sha="${IMAGE_TAG#sha-}"

          # Verify the commit is on the protected main branch without requiring a checkout.
          compare_response=$(gh api "repos/${{ github.repository }}/compare/main...$commit_sha")
          merge_base_sha=$(jq -r '.merge_base_commit.sha // empty' <<<"$compare_response")
          if [[ "$merge_base_sha" != "$commit_sha" ]]; then
            echo "::error::Commit $commit_sha is not on or reachable from protected main branch"
            exit 1
          fi

          # Verify the latest completed Gateway CI workflow run for this commit succeeded.
          latest_workflow_conclusion=$(gh api --paginate --slurp "repos/${{ github.repository }}/actions/workflows/gateway-image.yml/runs?head_sha=$commit_sha&status=completed&per_page=100" --jq '[.[].workflow_runs[] | select((.head_branch == "main" or .event == "push") and .head_repository.full_name == "${{ github.repository }}")] | sort_by(.created_at // "", .run_attempt // 0) | last | .conclusion // empty')
          if [[ -z "$latest_workflow_conclusion" ]]; then
            echo "::error::No completed Gateway CI run found for commit $commit_sha on main in this repository"
            exit 1
          fi
          if [[ "$latest_workflow_conclusion" != "success" ]]; then
            echo "::error::Latest Gateway CI run for commit $commit_sha did not succeed"
            exit 1
          fi

          # Verify the GHCR image exists with this tag and capture its immutable digest.
          registry_repo="${IMAGE_NAME#ghcr.io/}"
          image_ref="${{ env.IMAGE_NAME }}:$IMAGE_TAG"
          manifest_json=$(curl -fsSL \
            -u "${{ github.actor }}:$GH_TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$registry_repo/manifests/$IMAGE_TAG")
          verified_digest=$(curl -fsSI \
            -u "${{ github.actor }}:$GH_TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$registry_repo/manifests/$IMAGE_TAG" | tr -d '\r' | awk 'BEGIN { IGNORECASE = 1 } $1 == \"docker-content-digest:\" { print $2 }')
          if [[ -z "$verified_digest" ]]; then
            echo "::error::GHCR image not found: $image_ref"
            exit 1
          fi
          child_manifest_digest=$(jq -r '.manifests[0].digest // empty' <<<"$manifest_json")
          if [[ -n "$child_manifest_digest" ]]; then
            manifest_json=$(curl -fsSL \
              -u "${{ github.actor }}:$GH_TOKEN" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/$registry_repo/manifests/$child_manifest_digest")
          fi
          config_digest=$(jq -r '.config.digest // empty' <<<"$manifest_json")
          if [[ -z "$config_digest" ]]; then
            echo "::error::Failed to resolve image config digest for $image_ref"
            exit 1
          fi
          image_revision=$(curl -fsSL \
            -u "${{ github.actor }}:$GH_TOKEN" \
            "https://ghcr.io/v2/$registry_repo/blobs/$config_digest" | jq -r '.config.Labels[\"org.opencontainers.image.revision\"] // empty')
          if [[ "$image_revision" != "$commit_sha" ]]; then
            echo "::error::Registry image revision $image_revision does not match commit $commit_sha"
            exit 1
          fi

          if [[ -n "$PROVIDED_DIGEST" && "$verified_digest" != "$PROVIDED_DIGEST" ]]; then
            echo "::error::Digest mismatch! The image tag $IMAGE_TAG in the registry has digest $verified_digest, but expected $PROVIDED_DIGEST. The image may have been replaced."
            exit 1
          fi

          echo "Verified provenance: commit $commit_sha passed Gateway CI on main and image exists in GHCR as $verified_digest"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "verified_digest=$verified_digest" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout verified artifact source
        env:
          COMMIT_SHA: ${{ steps.verify.outputs.commit_sha }}
        run: |
          git fetch --no-tags origin "$COMMIT_SHA"
          git checkout --detach "$COMMIT_SHA"

      - name: Login to Azure with OIDC
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image tag
        id: gateway
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.verify.outputs.verified_digest }}
        run: |
          # Use digest-based reference for immutable deployment
          image="${{ env.IMAGE_NAME }}@$IMAGE_DIGEST"
          # Container Apps caps app-name + revision-suffix at 54 chars combined, so the
          # revision suffix uses a short SHA rather than the full 40-character image tag.
          revision_suffix="sha-${IMAGE_TAG#sha-}"
          revision_suffix="${revision_suffix:0:16}"
          az containerapp update \
            --name "${{ vars.GATEWAY_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$image" \
            --revision-suffix "$revision_suffix"
          gateway_fqdn=$(az containerapp show \
            --name "${{ vars.GATEWAY_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' \
            --output tsv)
          test -n "$gateway_fqdn"
          echo "url=https://$gateway_fqdn" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v5.1.1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/gateway.frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/gateway.frontend
        run: npm ci

      - name: Build frontend for Azure
        working-directory: src/gateway.frontend
        env:
          VITE_GATEWAY_URL: ${{ steps.gateway.outputs.url }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_EXTERNAL_ID_AUTHORITY }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_EXTERNAL_ID_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_EXTERNAL_ID_API_SCOPE }}
        run: npm run build

      - name: Upload frontend assets
        run: |
          az storage blob upload-batch \
            --account-name "${{ vars.FRONTEND_STORAGE_ACCOUNT }}" \
            --destination '$web' \
            --source src/gateway.frontend/dist \
            --auth-mode login \
            --overwrite

      - name: Restart active Container App revision
        run: |
          revision=$(az containerapp show \
            --name "${{ vars.GATEWAY_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.latestRevisionName' \
            --output tsv)
          test -n "$revision"
          az containerapp revision restart \
            --name "${{ vars.GATEWAY_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --revision "$revision"
          {
            echo "### Deployment"
            echo "- Image: \`${{ env.IMAGE_NAME }}@${{ steps.verify.outputs.verified_digest }}\`"
            echo "- Source commit: \`${{ steps.resolve.outputs.image_tag }}\`"
            echo "- Digest: \`${{ steps.verify.outputs.verified_digest }}\`"
            echo "- Revision restarted: \`$revision\`"
          } >> "$GITHUB_STEP_SUMMARY"