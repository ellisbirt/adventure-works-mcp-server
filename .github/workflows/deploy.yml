name: Deploy gateway

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable GHCR tag produced by Gateway CI (for example sha-<commit-sha>). Leave blank to deploy the latest successful main build.
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: gateway-production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Deploy selected gateway image and frontend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve image tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          image_tag="$IMAGE_TAG_INPUT"
          if [[ -z "$image_tag" ]]; then
            head_sha=$(gh api "repos/${{ github.repository }}/actions/workflows/gateway-image.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
            if [[ -z "$head_sha" ]]; then
              echo "::error::No successful Gateway CI run found on main; pass image_tag explicitly."
              exit 1
            fi
            image_tag="sha-$head_sha"
            echo "No image_tag supplied; resolved latest successful main build: $image_tag"
          fi
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]

      - name: Verify image provenance
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          commit_sha="${IMAGE_TAG#sha-}"
          
          # Verify the commit exists on the protected main branch
          if ! git ls-remote --exit-code --heads origin main | grep -q "$commit_sha"; then
            # Commit might be an ancestor of main, check if it's reachable from main
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$commit_sha" origin/main 2>/dev/null; then
              echo "::error::Commit $commit_sha is not on or reachable from protected main branch"
              exit 1
            fi
          fi
          
          # Verify the Gateway CI workflow completed successfully for this commit
          workflow_run=$(gh api "repos/${{ github.repository }}/actions/workflows/gateway-image.yml/runs?head_sha=$commit_sha&status=success&per_page=1" --jq '.workflow_runs[0] // empty')
          if [[ -z "$workflow_run" ]]; then
            echo "::error::No successful Gateway CI run found for commit $commit_sha"
            exit 1
          fi
          
          # Verify the GHCR image exists with this tag
          image_ref="${{ env.IMAGE_NAME }}:$IMAGE_TAG"
          if ! gh api --silent "orgs/${{ github.repository_owner }}/packages/container/$(basename ${{ github.repository }})/versions" --jq --arg tag "$IMAGE_TAG" '.[] | select(.metadata.container.tags[] == $tag)' | grep -q .; then
            echo "::error::GHCR image not found: $image_ref"
            exit 1
          fi
          
          echo "Verified provenance: commit $commit_sha passed Gateway CI on main and image exists in GHCR"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout verified artifact source
        env:
          COMMIT_SHA: ${{ steps.verify.outputs.commit_sha }}
        run: |
          git fetch --no-tags origin "$COMMIT_SHA"
          git checkout --detach "$COMMIT_SHA"

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image tag
        id: gateway
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          image="${{ env.IMAGE_NAME }}:$IMAGE_TAG"
          # Container Apps caps app-name + revision-suffix at 54 chars combined, so the
          # revision suffix uses a short SHA rather than the full 40-character image tag.
          revision_suffix="sha-${IMAGE_TAG#sha-}"
          revision_suffix="${revision_suffix:0:16}"
          az containerapp update \
            --name "${{ vars.GATEWAY_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$image" \
            --revision-suffix "$revision_suffix"
          gateway_fqdn=$(az containerapp show \
            --name "${{ vars.GATEWAY_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' \
            --output tsv)
          test -n "$gateway_fqdn"
          echo "url=https://$gateway_fqdn" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/gateway.frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/gateway.frontend
        run: npm ci

      - name: Build frontend for Azure
        working-directory: src/gateway.frontend
        env:
          VITE_GATEWAY_URL: ${{ steps.gateway.outputs.url }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_EXTERNAL_ID_AUTHORITY }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_EXTERNAL_ID_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_EXTERNAL_ID_API_SCOPE }}
        run: npm run build

      - name: Upload frontend assets
        run: |
          az storage blob upload-batch \
            --account-name "${{ vars.FRONTEND_STORAGE_ACCOUNT }}" \
            --destination '$web' \
            --source src/gateway.frontend/dist \
            --auth-mode login \
            --overwrite

      - name: Restart active Container App revision
        run: |
          revision=$(az containerapp show \
            --name "${{ vars.GATEWAY_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.latestRevisionName' \
            --output tsv)
          test -n "$revision"
          az containerapp revision restart \
            --name "${{ vars.GATEWAY_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --revision "$revision"
          {
            echo "### Deployment"
            echo "- Image: \`${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.image_tag }}\`"
            echo "- Source commit: \`${{ steps.resolve.outputs.image_tag }}\`"
            echo "- Revision restarted: \`$revision\`"
          } >> "$GITHUB_STEP_SUMMARY"