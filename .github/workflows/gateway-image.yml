name: Gateway image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - 'src/gateway/**'
      - 'src/gateway.test/**'
      - 'infrastructure/**'
      - '.github/workflows/gateway-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test gateway and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        run: dotnet restore src/gateway.test/gateway.test.csproj

      - name: Test gateway
        run: dotnet test src/gateway.test/gateway.test.csproj --configuration Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/gateway.frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/gateway.frontend
        run: npm ci

      - name: Build frontend
        working-directory: src/gateway.frontend
        env:
          VITE_GATEWAY_URL: ${{ vars.GATEWAY_URL }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_EXTERNAL_ID_AUTHORITY }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_EXTERNAL_ID_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_EXTERNAL_ID_API_SCOPE }}
        run: npm run build

  image:
    name: Build and publish GHCR image
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push gateway image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./src/gateway
          file: ./src/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image reference
        run: |
          echo "Published image: ${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA}"

  build:
    name: Build
    needs: image
    if: github.event_name != 'pull_request'
    outputs:
      digest: ${{ needs.image.outputs.digest }}
      artifact: ${{ steps.promotion.outputs.artifact }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image to release
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:release" \
            "${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}"

      - name: Record promoted artifact
        id: promotion
        run: |
          artifact="${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          {
            echo "### Promoted gateway artifact"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`$artifact\`"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Publish frontend to Azure Blob Static Website
    needs: [test, deploy]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/gateway.frontend/package-lock.json

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployed gateway URL
        id: gateway
        run: |
          gateway_fqdn=$(az containerapp show \
            --name "${{ vars.GATEWAY_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' \
            --output tsv)
          test -n "$gateway_fqdn"
          echo "url=https://$gateway_fqdn" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: src/gateway.frontend
        run: npm ci

      - name: Build frontend for Azure
        working-directory: src/gateway.frontend
        env:
          VITE_GATEWAY_URL: ${{ steps.gateway.outputs.url }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_EXTERNAL_ID_AUTHORITY }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_EXTERNAL_ID_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_EXTERNAL_ID_API_SCOPE }}
        run: npm run build

      - name: Upload frontend assets
        run: |
          az storage blob upload-batch \
            --account-name "${{ vars.FRONTEND_STORAGE_ACCOUNT }}" \
            --destination '$web' \
            --source src/gateway.frontend/dist \
            --auth-mode login \
            --overwrite

  deploy:
    name: Deploy gateway image
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "${{ vars.GATEWAY_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.artifact }}" \
            --revision-suffix "sha-${{ github.sha }}"

      - name: Verify deployed artifact
        run: |
          expected_image="${{ needs.build.outputs.artifact }}"
          deployed_image=$(az containerapp show \
            --name "${{ vars.GATEWAY_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.template.containers[0].image' \
            --output tsv)
          test "$deployed_image" = "$expected_image"
          echo "Deployed image: \`$deployed_image\`" >> "$GITHUB_STEP_SUMMARY"
