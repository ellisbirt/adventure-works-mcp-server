name: Gateway CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/gateway/**'
      - 'src/gateway.test/**'
      - 'src/gateway.frontend/**'
      - 'infrastructure/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test gateway and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        run: dotnet restore src/gateway.test/gateway.test.csproj

      - name: Test gateway
        run: dotnet test src/gateway.test/gateway.test.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload gateway coverage
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: gateway-coverage-${{ github.sha }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v5.1.1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/gateway.frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/gateway.frontend
        run: npm ci

      - name: Build frontend
        working-directory: src/gateway.frontend
        env:
          VITE_GATEWAY_URL: ${{ vars.GATEWAY_URL }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_EXTERNAL_ID_AUTHORITY }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_EXTERNAL_ID_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_EXTERNAL_ID_API_SCOPE }}
        run: npm run build

  image:
    name: Build and publish GHCR image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.2.2
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecf4c8b0c53f7c8d0b0e148e1f0e9 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push gateway image
        id: push
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v7.0.0
        with:
          context: ./src/gateway
          file: ./src/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image reference
        run: |
          image_tag="sha-${GITHUB_SHA}"
          echo "Published image tag: ${{ env.IMAGE_NAME }}:$image_tag"
          echo "Published image digest: ${{ steps.push.outputs.digest }}"
          {
            echo "### Gateway image published"
            echo ""
            echo "Deploy this build from the **Deploy gateway** workflow using:"
            echo ""
            echo '```text'
            echo "$image_tag"
            echo '```'
            echo ""
            echo "Full reference: \`${{ env.IMAGE_NAME }}:$image_tag\`"
            echo ""
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
