name: Gateway image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - 'src/gateway/**'
      - 'src/gateway.test/**'
      - '.github/workflows/gateway-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test gateway and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        run: dotnet restore src/gateway.test/gateway.test.csproj

      - name: Test gateway
        run: dotnet test src/gateway.test/gateway.test.csproj --configuration Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/gateway.frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/gateway.frontend
        run: npm ci

      - name: Build frontend
        working-directory: src/gateway.frontend
        env:
          VITE_GATEWAY_URL: ${{ vars.GATEWAY_URL }}
        run: npm run build

  image:
    name: Build and publish GHCR image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./src/gateway
          file: ./src/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image reference
        run: |
          echo "Published image: ${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA}"
          echo "Use this Terraform value: -var=gateway_container_image=${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA}"

  frontend:
    name: Publish frontend to Azure Blob Static Website
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/gateway.frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/gateway.frontend
        run: npm ci

      - name: Build frontend for Azure
        working-directory: src/gateway.frontend
        env:
          VITE_GATEWAY_URL: ${{ vars.GATEWAY_URL }}
        run: npm run build

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload frontend assets
        run: |
          az storage blob upload-batch \
            --account-name "${{ vars.FRONTEND_STORAGE_ACCOUNT }}" \
            --destination '$web' \
            --source src/gateway.frontend/dist \
            --auth-mode login \
            --overwrite
