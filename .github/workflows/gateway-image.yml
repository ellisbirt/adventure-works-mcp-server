name: Gateway image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - 'src/gateway/**'
      - 'src/gateway.test/**'
      - 'infrastructure/**'
      - '.github/workflows/gateway-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test gateway and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        run: dotnet restore src/gateway.test/gateway.test.csproj

      - name: Test gateway
        run: dotnet test src/gateway.test/gateway.test.csproj --configuration Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/gateway.frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/gateway.frontend
        run: npm ci

      - name: Build frontend
        working-directory: src/gateway.frontend
        env:
          VITE_GATEWAY_URL: ${{ vars.GATEWAY_URL }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_EXTERNAL_ID_AUTHORITY }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_EXTERNAL_ID_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_EXTERNAL_ID_API_SCOPE }}
        run: npm run build

  infrastructure:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        working-directory: infrastructure
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        working-directory: infrastructure
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: infrastructure
        run: terraform validate

  image:
    name: Build and publish GHCR image
    needs: [test, infrastructure]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./src/gateway
          file: ./src/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image reference
        run: |
          echo "Published image: ${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA}"
          echo "Use this Terraform value: -var=gateway_container_image=${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA}"

  frontend:
    name: Publish frontend to Azure Blob Static Website
    needs: [test, infrastructure, deploy]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/gateway.frontend/package-lock.json

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployed gateway URL
        id: gateway
        run: |
          gateway_fqdn=$(az containerapp show \
            --name "${{ vars.GATEWAY_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' \
            --output tsv)
          test -n "$gateway_fqdn"
          echo "url=https://$gateway_fqdn" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: src/gateway.frontend
        run: npm ci

      - name: Build frontend for Azure
        working-directory: src/gateway.frontend
        env:
          VITE_GATEWAY_URL: ${{ steps.gateway.outputs.url }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_EXTERNAL_ID_AUTHORITY }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_EXTERNAL_ID_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_EXTERNAL_ID_API_SCOPE }}
        run: npm run build

      - name: Upload frontend assets
        run: |
          az storage blob upload-batch \
            --account-name "${{ vars.FRONTEND_STORAGE_ACCOUNT }}" \
            --destination '$web' \
            --source src/gateway.frontend/dist \
            --auth-mode login \
            --overwrite

  deploy:
    name: Deploy gateway image with Terraform
    needs: [image, infrastructure]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_entra_admin_login_username: ${{ vars.ENTRA_ADMIN_LOGIN_USERNAME }}
      TF_VAR_entra_admin_object_id: ${{ vars.ENTRA_ADMIN_OBJECT_ID }}
      TF_VAR_gateway_container_image: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      TF_VAR_external_id_authority: ${{ vars.ENTRA_EXTERNAL_ID_AUTHORITY }}
      TF_VAR_external_id_api_audience: ${{ vars.ENTRA_EXTERNAL_ID_API_AUDIENCE }}
      TF_VAR_external_id_spa_client_id: ${{ vars.ENTRA_EXTERNAL_ID_SPA_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform backend
        working-directory: infrastructure
        env:
          ARM_USE_AZUREAD: true
        run: terraform init -upgrade -input=false

      - name: Apply gateway image deployment
        working-directory: infrastructure
        env:
          ARM_USE_AZUREAD: true
        run: terraform apply -input=false -auto-approve -lock-timeout=10m
